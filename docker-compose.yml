# Runs the full ShopVerse stack: PostgreSQL + Spring Boot API + React UI.
# Copy backend/.env.example to backend/.env and fill in your keys first.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopverse
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: shopverse
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./UI
      args:
        REACT_APP_API_BASE_URL: http://localhost:8080
        REACT_APP_STRIPE_KEY: ${REACT_APP_STRIPE_KEY:-}
        REACT_APP_CDN_URL: ${REACT_APP_CDN_URL:-}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
