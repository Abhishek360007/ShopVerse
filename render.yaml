# Render Blueprint: deploys the ShopVerse API and storefront.
# The database is hosted for free on Neon (neon.tech); Render asks for its details.
# Render dashboard -> New -> Blueprint -> pick this repo. See README "Deploy to Render".

services:
  # Spring Boot API
  - type: web
    name: shopverse-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/category
    envVars:
      # Neon database: copy these from Neon -> your project -> Connect
      - key: DB_HOST
        sync: false            # e.g. ep-cool-name-123456.ap-southeast-1.aws.neon.tech
      - key: DB_NAME
        sync: false            # e.g. neondb
      - key: DB_USER
        sync: false            # e.g. neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require         # Neon only accepts encrypted connections
      - key: FRONTEND_URL
        value: https://shopverse-web-lf22.onrender.com   # public address of shopverse-web
      - key: JWT_KEY
        generateValue: true    # random secret, created once
      - key: ADMIN_EMAIL
        sync: false            # Render asks you for this: the email that becomes store admin
      - key: EMAIL_VERIFICATION
        value: "false"         # no mail server yet; set to true after adding MAIL_* below
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75"
      # Optional integrations: replace these in the Render dashboard when you set them up
      - key: STRIPE_SECRET
        value: not-configured
      - key: MAIL_USERNAME
        value: not-configured
      - key: MAIL_PASSWORD
        value: not-configured
      - key: GOOGLE_OAUTH2_CLIENT_ID
        value: not-configured
      - key: GOOGLE_OAUTH2_CLIENT_SECRET
        value: not-configured
      - key: FILE_ZONE
        value: not-configured
      - key: CDN_KEY
        value: not-configured
      - key: CDN_HOST
        value: not-configured

  # React storefront
  - type: web
    name: shopverse-web
    runtime: static
    rootDir: UI
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite          # let React Router handle page URLs
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GENERATE_SOURCEMAP
        value: "false"
      - key: REACT_APP_API_BASE_URL
        value: https://shopverse-api-69m2.onrender.com   # public address of shopverse-api
      - key: REACT_APP_GOOGLE_LOGIN
        value: "false"
      - key: REACT_APP_STRIPE_KEY
        value: ""
