spring.application.name=shopverse

# Frontend URL (used for OAuth2 redirects)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Store owner account: this email gets the ADMIN role
app.admin.email=${ADMIN_EMAIL:}
# Load the starter catalog on an empty database
app.seed.enabled=${SEED_DATA:true}
# Require email verification on sign-up (set to false if no mail server is configured)
app.auth.email-verification=${EMAIL_VERIFICATION:true}

# Include error messages (e.g. "Not enough stock") in API error responses
server.error.include-message=always
spring.web.error.include-message=always

#server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:shopverse}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#JWT

jwt.auth.app=authapp
jwt.auth.secret_key=${JWT_KEY}
jwt.auth.expires_in=3600

# Google SignIn
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH2_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH2_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo


#Payment Gateway
stripe.secret=${STRIPE_SECRET}

#FileUpload
FILE_ZONE=${FILE_ZONE}
FILE_UPLOAD_API_KEY=${CDN_KEY}
FILE_UPLOAD_HOST_URL=${CDN_HOST}
