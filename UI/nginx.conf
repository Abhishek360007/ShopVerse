server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: send unknown routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
